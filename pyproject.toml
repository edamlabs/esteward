##### BUILD #####
[build-system]
requires = ["hatchling>=1.32", "uv-dynamic-versioning>=0.14"]
build-backend = "hatchling.build"

##### PROJECT #####
[project]
name = "esteward"
dynamic = ["version"]
description = "Self-maintenance engine for EDamLabs projects: deterministic dependency, upstream, release, docs, security and community modules."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "EDamLabs" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Environment :: Console",
]
dependencies = [
    "beartype>=0.22.9",
    "cyclopts>=4.25.3",
    "msgspec>=0.21",
    "pydantic-settings>=2.6",
    "rich>=14.0",
    "structlog>=26.1",
    "wreq>=0.10",
]

[project.scripts]
esteward = "esteward.cli.main:main"

[project.urls]
Source = "https://github.com/edamlabs/esteward"
Issues = "https://github.com/edamlabs/esteward/issues"

##### DEPS #####
[dependency-groups]
lint = [
    "ruff>=0.16",
    "ty>=0.0.75",
    "tach>=0.35",
    "validate-pyproject[all]>=0.26",
    "zizmor>=1.25",
]
test = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-httpserver>=1.1",
    "pytest-randomly>=5.0",
    "pytest-timeout>=2.4",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.4",
]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/esteward"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "fleet/", "README.md"]

##### LINT #####
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "T20", "EM", "ISC",
    "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "PL", "PERF", "FURB",
    "ASYNC", "S", "BLE", "FBT", "LOG", "G", "RUF",
]
### beartype (claw) resolves annotations at runtime: imports must stay real, never under TYPE_CHECKING.
ignore = ["E501", "ISC001", "PLR0913", "TC001", "TC002", "TC003"]

[tool.ruff.lint.per-file-ignores]
### pytest injects fixtures positionally: a test asks for as many as it needs.
"tests/**" = ["S101", "S106", "PLR2004", "PLR0917", "ARG", "FBT"]
### rule tables share one signature `(signal, settings, now)`: a rule ignoring an argument is expected.
"src/esteward/logic/modules/deps.py" = ["ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["esteward", "tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["msgspec.Struct", "pydantic_settings.BaseSettings"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true

##### TYPES #####
[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

##### TEST #####
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
pythonpath = ["."]
strict = true
filterwarnings = ["error"]
timeout = "60"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

##### COVERAGE #####
[tool.coverage.run]
source_pkgs = ["esteward"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", '^\s*\.\.\.$', "assert_never\\("]
